<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>팀 업무 현황 봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e3e1d9;
    --border2: #d0cec4;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #a09e98;
    --accent: #1a1916;
    --accent-bg: #1a1916;
    --accent-text: #f7f6f3;
    --success: #2d6a4f;
    --success-bg: #eaf4ee;
    --info-bg: #eef2ff;
    --info: #3730a3;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 30px;
    height: 30px;
    background: var(--accent-bg);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-text);
    font-size: 14px;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .logo-sub {
    font-size: 12px;
    color: var(--text3);
    margin-top: 1px;
  }

  .header-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── 왼쪽 문서 패널 ── */
  .docs-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .context-count {
    font-size: 11px;
    color: var(--text3);
  }

  .context-count.active {
    color: var(--success);
    font-weight: 500;
  }

  .doc-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .doc-list::-webkit-scrollbar { width: 4px; }
  .doc-list::-webkit-scrollbar-track { background: transparent; }
  .doc-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .doc-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .doc-card.filled {
    border-color: #a7f3d0;
    background: #fafffe;
  }

  .doc-trigger {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
  }

  .doc-icon {
    font-size: 15px;
    flex-shrink: 0;
  }

  .doc-meta { flex: 1; min-width: 0; }

  .doc-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .doc-hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }

  .doc-hint.ok { color: var(--success); }

  .chevron {
    font-size: 10px;
    color: var(--text3);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .chevron.open { transform: rotate(180deg); }

  .doc-body {
    display: none;
    padding: 0 10px 10px;
  }

  .doc-body.open { display: block; }

  .doc-body textarea {
    width: 100%;
    min-height: 110px;
    max-height: 220px;
    resize: vertical;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .doc-body textarea:focus { border-color: var(--border2); }
  .doc-body textarea::placeholder { color: var(--text3); }

  .member-name-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }

  .member-name-row input {
    flex: 1;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Pretendard', sans-serif;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  .member-name-row input:focus { border-color: var(--border2); }

  .del-btn {
    padding: 6px 8px;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text3);
    cursor: pointer;
    transition: all 0.15s;
  }

  .del-btn:hover { border-color: #fca5a5; color: #dc2626; }

  .add-member-btn {
    margin: 8px 10px;
    padding: 9px;
    background: transparent;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: 'Pretendard', sans-serif;
  }

  .add-member-btn:hover {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--border2);
  }

  /* ── 오른쪽 채팅 ── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text3);
    text-align: center;
    padding: 40px 20px;
  }

  .empty-icon {
    font-size: 36px;
    margin-bottom: 4px;
    opacity: 0.6;
  }

  .empty-state h2 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text2);
  }

  .empty-state p {
    font-size: 13px;
    line-height: 1.6;
    max-width: 280px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 80%;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  .msg.assistant .msg-avatar {
    background: var(--accent-bg);
    color: var(--accent-text);
  }

  .msg.user .msg-avatar {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    border: 1px solid var(--border);
  }

  .msg.assistant .msg-bubble {
    background: var(--surface);
    color: var(--text);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
  }

  .msg.user .msg-bubble {
    background: var(--accent-bg);
    color: var(--accent-text);
    border-color: transparent;
    border-radius: var(--radius) 4px var(--radius) var(--radius);
  }

  .typing-bubble {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 16px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text3);
    animation: pulse 1.2s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ── 추천 질문 ── */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 28px 12px;
  }

  .sugg-btn {
    padding: 6px 13px;
    font-size: 12px;
    font-family: 'Pretendard', sans-serif;
    border: 1px solid var(--border2);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .sugg-btn:hover {
    background: var(--accent-bg);
    color: var(--accent-text);
    border-color: transparent;
  }

  /* ── 입력창 ── */
  .input-area {
    padding: 12px 28px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-area textarea {
    flex: 1;
    min-height: 44px;
    max-height: 130px;
    padding: 11px 15px;
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
    line-height: 1.5;
    resize: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area textarea:focus { border-color: var(--border2); }
  .input-area textarea::placeholder { color: var(--text3); }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius);
    background: var(--accent-bg);
    color: var(--accent-text);
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: default; }

  strong { font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">🗂</div>
    <div>
      <div class="logo-text">팀 업무 현황 봇</div>
      <div class="logo-sub">기획안 · 회의록 · 팀원 로그 기반 Q&A</div>
    </div>
  </div>
  <div class="header-badge" id="ctxBadge">문서 0개 입력됨</div>
</header>

<div class="main">
  <!-- 왼쪽 문서 패널 -->
  <div class="docs-panel">
    <div class="panel-header">
      <span class="panel-label">컨텍스트 문서</span>
    </div>

    <div class="doc-list" id="docList"></div>
    <button class="add-member-btn" onclick="addMember()">+ 팀원 추가</button>
  </div>

  <!-- 오른쪽 채팅 -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <h2>업무 현황을 물어보세요</h2>
        <p>왼쪽에 기획안, 회의록, 팀원 업무 로그를 붙여넣으면<br/>진행 상황을 바로 파악할 수 있어요.</p>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="sugg-btn" onclick="ask(this)">전체 진행 상황 요약해줘</button>
      <button class="sugg-btn" onclick="ask(this)">지금 블로킹 이슈 있어?</button>
      <button class="sugg-btn" onclick="ask(this)">각 팀원 오늘 뭐 했어?</button>
      <button class="sugg-btn" onclick="ask(this)">API 연동 어디까지 됐어?</button>
      <button class="sugg-btn" onclick="ask(this)">다음에 해야 할 일이 뭐야?</button>
    </div>

    <div class="input-area">
      <textarea id="chatInput" placeholder="업무 현황, 구현 방식, 진행률 등 뭐든 물어보세요..." rows="1"
        onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<script>
const BASE_DOCS = [
  { id: 'plan', icon: '📋', name: '기획안', ph: '서비스 기획안, PRD, 기능 명세서 등을 붙여넣으세요...' },
  { id: 'meeting', icon: '📝', name: '회의록', ph: '최근 회의 내용, 결정 사항, 액션 아이템 등을 붙여넣으세요...' },
];

let docs = BASE_DOCS.map(d => ({ ...d, content: '', open: false }));
let members = [];
let memberSeq = 0;
let messages = [];
let loading = false;

function renderDocs() {
  const list = document.getElementById('docList');
  list.innerHTML = '';
  [...docs, ...members].forEach(doc => {
    const card = document.createElement('div');
    card.className = 'doc-card' + (doc.content ? ' filled' : '');
    card.innerHTML = `
      <div class="doc-trigger" onclick="toggleDoc('${doc.id}')">
        <span class="doc-icon">${doc.icon}</span>
        <div class="doc-meta">
          ${doc.isMember ? `<div class="member-name-row" onclick="event.stopPropagation()">
            <input type="text" value="${doc.name}" placeholder="팀원 이름" oninput="renameDoc('${doc.id}', this.value)" />
            <button class="del-btn" onclick="removeDoc('${doc.id}')">✕</button>
          </div>` : `<div class="doc-name">${doc.name}</div>`}
          <div class="doc-hint ${doc.content ? 'ok' : ''}">${doc.content ? '입력됨 · ' + doc.content.length + '자' : '비어있음'}</div>
        </div>
        <span class="chevron ${doc.open ? 'open' : ''}">▼</span>
      </div>
      <div class="doc-body ${doc.open ? 'open' : ''}">
        <textarea placeholder="${doc.ph}" oninput="updateDoc('${doc.id}', this.value)">${doc.content}</textarea>
      </div>`;
    list.appendChild(card);
  });
  updateBadge();
}

function toggleDoc(id) {
  const all = [...docs, ...members];
  const doc = all.find(d => d.id === id);
  if (doc) { doc.open = !doc.open; renderDocs(); }
}

function updateDoc(id, val) {
  const all = [...docs, ...members];
  const doc = all.find(d => d.id === id);
  if (doc) { doc.content = val; updateBadge(); }
  const card = document.querySelector(`[onclick="toggleDoc('${id}')"]`)?.closest('.doc-card');
  if (card) {
    card.classList.toggle('filled', !!val);
    const hint = card.querySelector('.doc-hint');
    if (hint) { hint.className = 'doc-hint' + (val ? ' ok' : ''); hint.textContent = val ? `입력됨 · ${val.length}자` : '비어있음'; }
  }
}

function renameDoc(id, val) {
  const doc = members.find(d => d.id === id);
  if (doc) doc.name = val;
}

function removeDoc(id) {
  members = members.filter(d => d.id !== id);
  renderDocs();
}

function addMember() {
  memberSeq++;
  members.push({
    id: 'mbr_' + memberSeq,
    icon: '👤',
    name: '팀원 ' + memberSeq,
    ph: 'AI 대화 요약 또는 업무 내용을 붙여넣으세요.\n\n예시:\n- OAuth 로그인 플로우 구현 완료\n- 토큰 갱신 race condition 발견, 내일 수정 예정\n- 카카오 소셜 로그인 연동 60% 완료',
    content: '',
    open: true,
    isMember: true,
  });
  renderDocs();
}

function updateBadge() {
  const filled = [...docs, ...members].filter(d => d.content.trim()).length;
  const badge = document.getElementById('ctxBadge');
  badge.textContent = `문서 ${filled}개 입력됨`;
  badge.style.color = filled > 0 ? 'var(--success)' : '';
  badge.style.background = filled > 0 ? 'var(--success-bg)' : '';
  badge.style.borderColor = filled > 0 ? '#a7f3d0' : '';
}

function buildSystem() {
  const filled = [...docs, ...members].filter(d => d.content.trim());
  if (!filled.length) return '아직 입력된 문서가 없습니다. 사용자에게 왼쪽 패널에서 기획안, 회의록, 팀원 업무 로그를 입력해달라고 안내해주세요. 한국어로 친근하게 답변하세요.';
  let sys = `당신은 개발팀 프로젝트의 업무 현황 어시스턴트입니다.
아래 문서들을 기반으로만 답변하세요. 외부 정보나 추측은 하지 마세요.
문서에 없는 내용은 솔직하게 "해당 내용은 입력된 문서에서 확인할 수 없어요"라고 답하세요.
답변은 한국어로, 핵심만 명확하고 간결하게 작성하세요.\n\n=== 입력된 문서 ===\n\n`;
  filled.forEach(d => { sys += `[${d.name}]\n${d.content}\n\n`; });
  return sys;
}

function ask(btn) {
  document.getElementById('chatInput').value = btn.textContent;
  send();
}

async function send() {
  const el = document.getElementById('chatInput');
  const text = el.value.trim();
  if (!text || loading) return;
  el.value = '';
  el.style.height = 'auto';

  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  loading = true;
  document.getElementById('sendBtn').disabled = true;
  messages.push({ role: 'user', content: text });
  renderMsgs();

  const typingId = addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, systemPrompt: buildSystem() }),
    });
    const data = await res.json();
    removeTyping(typingId);
    const reply = data.content || data.error || '응답을 받지 못했어요.';
    messages.push({ role: 'assistant', content: reply });
    renderMsgs();
  } catch (e) {
    removeTyping(typingId);
    messages.push({ role: 'assistant', content: '오류가 발생했어요. 잠시 후 다시 시도해주세요.' });
    renderMsgs();
  }

  loading = false;
  document.getElementById('sendBtn').disabled = false;
}

let tSeq = 0;
function addTyping() {
  const id = 'typing_' + (++tSeq);
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = id;
  wrap.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  document.getElementById('chatMessages').appendChild(wrap);
  document.getElementById('chatMessages').scrollTop = 99999;
  return id;
}

function removeTyping(id) { document.getElementById(id)?.remove(); }

function renderMsgs() {
  const chat = document.getElementById('chatMessages');
  chat.querySelectorAll('.msg:not([id^="typing_"])').forEach(e => e.remove());
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.innerHTML = `<div class="msg-avatar">${m.role === 'user' ? '나' : 'AI'}</div><div class="msg-bubble">${fmt(m.content)}</div>`;
    const typing = chat.querySelector('[id^="typing_"]');
    typing ? chat.insertBefore(div, typing) : chat.appendChild(div);
  });
  chat.scrollTop = 99999;
}

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

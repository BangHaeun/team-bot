<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>팀 업무 현황 봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --surface2: #f0efe9;
    --border: #e3e1d9; --border2: #d0cec4;
    --text: #1a1916; --text2: #6b6860; --text3: #a09e98;
    --accent-bg: #1a1916; --accent-text: #f7f6f3;
    --success: #2d6a4f; --success-bg: #eaf4ee;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── 로그인 ── */
  .login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .login-box h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .login-box p { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .login-box input { width: 100%; padding: 11px 14px; font-size: 14px; font-family: 'Pretendard', sans-serif; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
  .login-box input:focus { border-color: var(--border2); }
  .login-box button { width: 100%; padding: 11px; font-size: 14px; font-weight: 500; font-family: 'Pretendard', sans-serif; background: var(--accent-bg); color: var(--accent-text); border: none; border-radius: var(--radius); cursor: pointer; transition: opacity 0.15s; }
  .login-box button:hover { opacity: 0.85; }
  .login-hint { font-size: 11px; color: var(--text3); text-align: center; }

  /* ── 헤더 ── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 30px; height: 30px; background: var(--accent-bg); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--accent-text); font-size: 14px; }
  .logo-text { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .logo-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .user-badge.admin { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
  .ctx-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
  .ctx-badge.active { background: var(--success-bg); color: var(--success); border-color: #a7f3d0; }
  .save-status { font-size: 11px; color: var(--text3); }

  /* ── 레이아웃 ── */
  .main { flex: 1; display: flex; overflow: hidden; }

  /* ── 왼쪽 패널 ── */
  .docs-panel { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
  .docs-scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .docs-scroll-area::-webkit-scrollbar { width: 4px; }
  .docs-scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* 섹션 구분 */
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); padding: 12px 10px 4px; }

  /* 문서 카드 */
  .doc-list { padding: 4px 10px; display: flex; flex-direction: column; gap: 6px; }
  .doc-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color 0.15s; }
  .doc-card.filled { border-color: #a7f3d0; background: #fafffe; }
  .doc-card.readonly { opacity: 0.65; }
  .doc-trigger { padding: 10px 12px; display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .doc-icon { font-size: 15px; flex-shrink: 0; }
  .doc-meta { flex: 1; min-width: 0; }
  .doc-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-hint { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .doc-hint.ok { color: var(--success); }
  .readonly-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); margin-top: 3px; display: inline-block; }
  .chevron { font-size: 10px; color: var(--text3); transition: transform 0.2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .doc-body { display: none; padding: 0 10px 10px; }
  .doc-body.open { display: block; }
  .doc-body textarea { width: 100%; min-height: 120px; max-height: 400px; resize: vertical; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  .doc-body textarea:focus { border-color: var(--border2); }
  .doc-body textarea::placeholder { color: var(--text3); }
  .doc-body textarea:disabled { background: var(--bg); color: var(--text2); cursor: not-allowed; }

  /* 팀원 현황 리스트 */
  .member-list { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 5px; }
  .member-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border); }
  .member-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text2); flex-shrink: 0; border: 1px solid var(--border); }
  .member-avatar.me { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
  .member-avatar.admin { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }
  .member-name { flex: 1; font-size: 12px; font-weight: 500; color: var(--text); }
  .log-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .log-dot.filled { background: #34d399; }
  .log-dot-label { font-size: 10px; color: var(--text3); }

  /* ── 채팅 ── */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text3); text-align: center; padding: 40px 20px; }
  .empty-icon { font-size: 36px; margin-bottom: 4px; opacity: 0.6; }
  .empty-state h2 { font-size: 16px; font-weight: 500; color: var(--text2); }
  .empty-state p { font-size: 13px; line-height: 1.6; max-width: 280px; }
  .msg { display: flex; gap: 10px; max-width: 80%; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .msg.assistant .msg-avatar { background: var(--accent-bg); color: var(--accent-text); }
  .msg.user .msg-avatar { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .msg-bubble { padding: 10px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.7; border: 1px solid var(--border); }
  .msg.assistant .msg-bubble { background: var(--surface); color: var(--text); border-radius: 4px var(--radius) var(--radius) var(--radius); }
  .msg.user .msg-bubble { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; border-radius: var(--radius) 4px var(--radius) var(--radius); }
  .typing-bubble { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 28px 12px; }
  .sugg-btn { padding: 6px 13px; font-size: 12px; font-family: 'Pretendard', sans-serif; border: 1px solid var(--border2); border-radius: 20px; background: var(--surface); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .sugg-btn:hover { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }
  .input-area { padding: 12px 28px 20px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-end; }
  .input-area textarea { flex: 1; min-height: 44px; max-height: 130px; padding: 11px 15px; font-size: 14px; font-family: 'Pretendard', sans-serif; line-height: 1.5; resize: none; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
  .input-area textarea:focus { border-color: var(--border2); }
  .input-area textarea::placeholder { color: var(--text3); }
  .send-btn { width: 44px; height: 44px; border-radius: var(--radius); background: var(--accent-bg); color: var(--accent-text); border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: default; }
  strong { font-weight: 600; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🗂 팀 업무 현황 봇</h2>
    <p>이름을 입력하면 자동으로 팀원으로 등록되고<br/>자신의 업무 로그를 올릴 수 있어요.</p>
    <input type="text" id="nameInput" placeholder="이름 입력 (예: 김민준)" maxlength="20" onkeydown="if(event.key==='Enter') login()" />
    <button onclick="login()">입장하기</button>
    <div class="login-hint">이름은 이 기기에 저장돼요</div>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">🗂</div>
    <div>
      <div class="logo-text">팀 업무 현황 봇</div>
      <div class="logo-sub">기획안 · 회의록 · 팀원 로그 기반 Q&A</div>
    </div>
  </div>
  <div class="header-right">
    <span class="save-status" id="saveStatus"></span>
    <span class="ctx-badge" id="ctxBadge">문서 0개</span>
    <span class="user-badge" id="userBadge"></span>
  </div>
</header>

<div class="main">
  <div class="docs-panel">
    <div class="panel-header">
      <div class="panel-label">컨텍스트 문서</div>
    </div>
    <div class="docs-scroll-area" id="docsScrollArea">
      <!-- JS로 렌더 -->
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <h2>업무 현황을 물어보세요</h2>
        <p>왼쪽에 기획안, 회의록, 팀원 업무 로그가 입력되면<br/>진행 상황을 바로 파악할 수 있어요.</p>
      </div>
    </div>
    <div class="suggestions">
      <button class="sugg-btn" onclick="ask(this)">전체 진행 상황 요약해줘</button>
      <button class="sugg-btn" onclick="ask(this)">지금 블로킹 이슈 있어?</button>
      <button class="sugg-btn" onclick="ask(this)">각 팀원 오늘 뭐 했어?</button>
      <button class="sugg-btn" onclick="ask(this)">API 연동 어디까지 됐어?</button>
      <button class="sugg-btn" onclick="ask(this)">다음에 해야 할 일이 뭐야?</button>
    </div>
    <div class="input-area">
      <textarea id="chatInput" placeholder="업무 현황, 구현 방식, 진행률 등 뭐든 물어보세요..." rows="1"
        onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<script>
// ── 팀장 이름 설정 ──────────────────────────────
const ADMIN_NAME = '방하은';

// ── 상태 ────────────────────────────────────────
let currentUser = null;
let isAdmin = false;

// state: { baseDocs: {plan, meeting}, members: { 이름: { content, joinedAt } } }
let state = {
  baseDocs: { plan: '', meeting: '' },
  members: {},
};

// UI 열림 상태 (로컬)
let openCards = {};
let messages = [];
let loading = false;
let saveTimer = null;

// ── 로그인 ──────────────────────────────────────
async function login() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  currentUser = name;
  isAdmin = name === ADMIN_NAME;
  localStorage.setItem('teambot_user', name);
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('userBadge').textContent = isAdmin ? `👑 ${name} (팀장)` : `👤 ${name}`;
  document.getElementById('userBadge').className = 'user-badge' + (isAdmin ? ' admin' : '');

  await loadState();

  // 팀원이면 자동 등록
  if (!state.members[name]) {
    state.members[name] = { content: '', joinedAt: Date.now() };
    await saveState();
  }

  renderAll();
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('teambot_user');
  if (saved) document.getElementById('nameInput').value = saved;
});

// ── KV ──────────────────────────────────────────
async function loadState() {
  setSaveStatus('불러오는 중...');
  try {
    const res = await fetch('/api/load');
    const data = await res.json();
    if (data.value) {
      const loaded = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
      if (loaded.baseDocs) state.baseDocs = loaded.baseDocs;
      if (loaded.members) state.members = loaded.members;
    }
  } catch (e) { console.error('load error', e); }
  setSaveStatus('');
}

async function saveState() {
  setSaveStatus('저장 중...');
  try {
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'team_state', value: JSON.stringify(state) }),
    });
    setSaveStatus('저장됨 ✓');
    setTimeout(() => setSaveStatus(''), 2000);
  } catch (e) { setSaveStatus('저장 실패'); }
}

function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 1200); }
function setSaveStatus(msg) { document.getElementById('saveStatus').textContent = msg; }

// ── 렌더 ────────────────────────────────────────
function renderAll() {
  const area = document.getElementById('docsScrollArea');
  area.innerHTML = '';

  // ── 팀 문서 섹션 (기획안/회의록) ──
  const teamLabel = document.createElement('div');
  teamLabel.className = 'section-label';
  teamLabel.textContent = '팀 문서';
  area.appendChild(teamLabel);

  const docList = document.createElement('div');
  docList.className = 'doc-list';

  [
    { id: 'plan', icon: '📋', name: '기획안', ph: '서비스 기획안, PRD, 기능 명세서 등을 붙여넣으세요...' },
    { id: 'meeting', icon: '📝', name: '회의록', ph: '최근 회의 내용, 결정 사항, 액션 아이템 등을 붙여넣으세요...' },
  ].forEach(doc => {
    const content = state.baseDocs[doc.id] || '';
    const editable = isAdmin;
    const open = !!openCards[doc.id];
    const card = document.createElement('div');
    card.className = 'doc-card' + (content ? ' filled' : '') + (!editable ? ' readonly' : '');
    card.innerHTML = `
      <div class="doc-trigger" onclick="toggleCard('${doc.id}')">
        <span class="doc-icon">${doc.icon}</span>
        <div class="doc-meta">
          <div class="doc-name">${doc.name}</div>
          <div class="doc-hint ${content ? 'ok' : ''}">${content ? '입력됨 · ' + content.length + '자' : '비어있음'}</div>
          ${!editable ? '<span class="readonly-tag">읽기 전용</span>' : ''}
        </div>
        <span class="chevron ${open ? 'open' : ''}">▼</span>
      </div>
      <div class="doc-body ${open ? 'open' : ''}">
        <textarea placeholder="${doc.ph}" ${!editable ? 'disabled' : `oninput="updateBaseDoc('${doc.id}', this.value)"`}>${content}</textarea>
      </div>`;
    docList.appendChild(card);
  });
  area.appendChild(docList);

  // ── 내 로그 섹션 ──
  const myLabel = document.createElement('div');
  myLabel.className = 'section-label';
  myLabel.textContent = '내 업무 로그';
  area.appendChild(myLabel);

  const myDocList = document.createElement('div');
  myDocList.className = 'doc-list';
  const myContent = state.members[currentUser]?.content || '';
  const myOpen = !!openCards['mylog'];
  const myCard = document.createElement('div');
  myCard.className = 'doc-card' + (myContent ? ' filled' : '');
  myCard.innerHTML = `
    <div class="doc-trigger" onclick="toggleCard('mylog')">
      <span class="doc-icon">📌</span>
      <div class="doc-meta">
        <div class="doc-name">${currentUser}의 로그</div>
        <div class="doc-hint ${myContent ? 'ok' : ''}">${myContent ? '입력됨 · ' + myContent.length + '자' : '비어있음'}</div>
      </div>
      <span class="chevron ${myOpen ? 'open' : ''}">▼</span>
    </div>
    <div class="doc-body ${myOpen ? 'open' : ''}">
      <textarea placeholder="AI 대화 요약 또는 오늘 한 일을 붙여넣으세요.\n\n예시:\n- OAuth 로그인 플로우 구현 완료\n- 토큰 갱신 race condition 발견, 내일 수정 예정" oninput="updateMyLog(this.value)">${myContent}</textarea>
    </div>`;
  myDocList.appendChild(myCard);
  area.appendChild(myDocList);

  // ── 팀원 현황 섹션 ──
  const memberLabel = document.createElement('div');
  memberLabel.className = 'section-label';
  memberLabel.textContent = '팀원 현황';
  area.appendChild(memberLabel);

  const memberList = document.createElement('div');
  memberList.className = 'member-list';

  // 팀장 먼저
  const allNames = Object.keys(state.members).sort((a, b) => {
    if (a === ADMIN_NAME) return -1;
    if (b === ADMIN_NAME) return 1;
    return (state.members[a].joinedAt || 0) - (state.members[b].joinedAt || 0);
  });

  allNames.forEach(name => {
    const hasLog = !!(state.members[name]?.content?.trim());
    const isMe = name === currentUser;
    const isThisAdmin = name === ADMIN_NAME;
    const initials = name.slice(0, 1);
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <div class="member-avatar ${isThisAdmin ? 'admin' : isMe ? 'me' : ''}">${initials}</div>
      <div class="member-name">${name}${isThisAdmin ? ' 👑' : ''}${isMe ? ' (나)' : ''}</div>
      <div class="log-dot ${hasLog ? 'filled' : ''}"></div>
      <div class="log-dot-label">${hasLog ? '로그 있음' : '미제출'}</div>`;
    memberList.appendChild(row);
  });

  if (allNames.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'font-size:12px;color:var(--text3);padding:8px 10px;';
    empty.textContent = '아직 입장한 팀원이 없어요';
    memberList.appendChild(empty);
  }

  area.appendChild(memberList);
  updateBadge();
}

function toggleCard(id) {
  openCards[id] = !openCards[id];
  renderAll();
}

function updateBaseDoc(id, val) {
  state.baseDocs[id] = val;
  updateBadge();
  scheduleSave();
}

function updateMyLog(val) {
  if (!state.members[currentUser]) state.members[currentUser] = { content: '', joinedAt: Date.now() };
  state.members[currentUser].content = val;
  updateBadge();
  scheduleSave();
  // 팀원 현황 dot만 업데이트
  renderMemberStatus();
}

function renderMemberStatus() {
  // 전체 리렌더 대신 dot만 업데이트
  const rows = document.querySelectorAll('.member-row');
  const allNames = Object.keys(state.members).sort((a, b) => {
    if (a === ADMIN_NAME) return -1;
    if (b === ADMIN_NAME) return 1;
    return (state.members[a].joinedAt || 0) - (state.members[b].joinedAt || 0);
  });
  rows.forEach((row, i) => {
    const name = allNames[i];
    if (!name) return;
    const hasLog = !!(state.members[name]?.content?.trim());
    const dot = row.querySelector('.log-dot');
    const label = row.querySelector('.log-dot-label');
    if (dot) dot.className = 'log-dot' + (hasLog ? ' filled' : '');
    if (label) label.textContent = hasLog ? '로그 있음' : '미제출';
  });
}

function updateBadge() {
  const baseFilled = Object.values(state.baseDocs).filter(v => v.trim()).length;
  const memberFilled = Object.values(state.members).filter(m => m.content?.trim()).length;
  const total = baseFilled + memberFilled;
  const badge = document.getElementById('ctxBadge');
  badge.textContent = `문서 ${total}개`;
  badge.className = 'ctx-badge' + (total > 0 ? ' active' : '');
}

// ── 채팅 ────────────────────────────────────────
function buildSystem() {
  const parts = [];
  if (state.baseDocs.plan?.trim()) parts.push(`[기획안]\n${state.baseDocs.plan}`);
  if (state.baseDocs.meeting?.trim()) parts.push(`[회의록]\n${state.baseDocs.meeting}`);
  Object.entries(state.members).forEach(([name, m]) => {
    if (m.content?.trim()) parts.push(`[${name} 업무 로그]\n${m.content}`);
  });
  if (!parts.length) return '아직 입력된 문서가 없습니다. 한국어로 친근하게 안내해주세요.';
  return `당신은 개발팀 프로젝트의 업무 현황 어시스턴트입니다.
아래 문서들을 기반으로만 답변하세요. 외부 정보나 추측은 하지 마세요.
문서에 없는 내용은 "해당 내용은 입력된 문서에서 확인할 수 없어요"라고 답하세요.
답변은 한국어로, 핵심만 명확하고 간결하게 작성하세요.\n\n=== 입력된 문서 ===\n\n${parts.join('\n\n')}`;
}

function ask(btn) { document.getElementById('chatInput').value = btn.textContent; send(); }

async function send() {
  const el = document.getElementById('chatInput');
  const text = el.value.trim();
  if (!text || loading) return;
  el.value = ''; el.style.height = 'auto';
  document.getElementById('emptyState')?.remove();
  loading = true;
  document.getElementById('sendBtn').disabled = true;
  messages.push({ role: 'user', content: text });
  renderMsgs();
  const typingId = addTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, systemPrompt: buildSystem() }),
    });
    const data = await res.json();
    removeTyping(typingId);
    messages.push({ role: 'assistant', content: data.content || data.error || '응답을 받지 못했어요.' });
    renderMsgs();
  } catch (e) {
    removeTyping(typingId);
    messages.push({ role: 'assistant', content: '오류가 발생했어요. 잠시 후 다시 시도해주세요.' });
    renderMsgs();
  }
  loading = false;
  document.getElementById('sendBtn').disabled = false;
}

let tSeq = 0;
function addTyping() {
  const id = 'typing_' + (++tSeq);
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant'; wrap.id = id;
  wrap.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  document.getElementById('chatMessages').appendChild(wrap);
  document.getElementById('chatMessages').scrollTop = 99999;
  return id;
}
function removeTyping(id) { document.getElementById(id)?.remove(); }

function renderMsgs() {
  const chat = document.getElementById('chatMessages');
  chat.querySelectorAll('.msg:not([id^="typing_"])').forEach(e => e.remove());
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.innerHTML = `<div class="msg-avatar">${m.role === 'user' ? '나' : 'AI'}</div><div class="msg-bubble">${fmt(m.content)}</div>`;
    const typing = chat.querySelector('[id^="typing_"]');
    typing ? chat.insertBefore(div, typing) : chat.appendChild(div);
  });
  chat.scrollTop = 99999;
}

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 130) + 'px'; }
</script>
